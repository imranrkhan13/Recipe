[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Single-page app fallback. /api/* is served by the function above.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
